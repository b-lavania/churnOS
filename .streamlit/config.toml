[theme]
base = "light"
primaryColor = "#0a5a46"
backgroundColor = "#faf9f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f1112"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[logger]
level = "info"

[ui]
hideTopBar = false
hideSidebarNav = false

[browser]
gatherUsageStats = false
