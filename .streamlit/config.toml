[theme]
primaryColor = "#00f2ff"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
font = "monospace"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[logger]
level = "info"

[ui]
hideTopBar = false
hideSidebarNav = false

[browser]
gatherUsageStats = false
